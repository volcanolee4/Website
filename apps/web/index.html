		<title>HYGOAL | Precision Machine Components Manufacturer</title>
		<script type="text/javascript">
			// SPA 路由还原：配合 public/404.html 使用。
			// 直接访问 /Website/products/xxx 时，404.html 会重定向到
			// /Website/?p=/products/xxx，这里把 ?p= 里的路径还原进 history。
			(function () {
				var params = new URLSearchParams(window.location.search);
				var p = params.get('p');
				if (p) {
					params.delete('p');
					var qs = params.toString();
					var url = '/Website' + p + (qs ? '?' + qs : '') + window.location.hash;
					window.history.replaceState(null, '', url);
				}
			})();
		</script>
