<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>内容管理后台</title>
  <style>
    /* ===== 自定义表格 widget 样式 ===== */
    .hygoal-table-editor { width: 100%; }

    /* 格式 / 符号工具栏 */
    .hygoal-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 8px;
      margin-bottom: 8px;
      background: #f6f8fa;
      border: 1px solid #e3e8ee;
      border-radius: 4px;
    }
    .hygoal-toolbar-label { font-size: 12px; color: #5b6b7b; font-weight: 600; }
    .hygoal-toolbar-sep { width: 1px; height: 20px; background: #d0d7df; margin: 0 4px; }
    .hygoal-toolbar-hint { margin-left: auto; font-size: 11px; color: #8a97a5; }
    .hygoal-select {
      padding: 3px 6px;
      font-size: 12px;
      border: 1px solid #ccd4dc;
      border-radius: 3px;
      background: #fff;
      color: #1c2530;
      max-width: 160px;
    }
    .hygoal-select:disabled { background: #eef1f4; color: #9aa6b2; cursor: not-allowed; }
    .hygoal-sym {
      min-width: 27px;
      height: 24px;
      padding: 0 4px;
      border: 1px solid #ccd4dc;
      border-radius: 3px;
      background: #fff;
      color: #1c2530;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    .hygoal-sym:hover { background: #eef7f4; border-color: #2f7d6d; color: #2f7d6d; }

    /* 排版按钮：全选 / 加粗 / 对齐 */
    .hygoal-format-btn {
      min-width: 28px;
      height: 24px;
      padding: 0 7px;
      border: 1px solid #ccd4dc;
      border-radius: 3px;
      background: #fff;
      color: #1c2530;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }
    .hygoal-format-btn:hover { background: #eef7f4; border-color: #2f7d6d; color: #2f7d6d; }
    .hygoal-format-btn:disabled { background: #eef1f4; color: #9aa6b2; cursor: not-allowed; }
    .hygoal-format-btn.hygoal-active { background: #2f7d6d; border-color: #2f7d6d; color: #fff; }
    .hygoal-format-btn.hygoal-bold { font-weight: 700; }
    .hygoal-format-btn.hygoal-all { color: #2f7d6d; border-color: #2f7d6d; }
    .hygoal-format-btn.hygoal-all.hygoal-active { background: #2f7d6d; color: #fff; }

    /* 表格 */
    .hygoal-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 8px;
      table-layout: fixed;
      -webkit-user-select: none;
      user-select: none;
    }
    .hygoal-table input {
      -webkit-user-select: text;
      user-select: text;
    }
    /* 结构工具栏里的数量输入框 / 合并提示 */
    .hygoal-num { width: 46px; padding: 3px 4px; font-size: 12px; border: 1px solid #ccd4dc; border-radius: 3px; }
    .hygoal-col-note { font-size: 11px; color: #8a97a5; }
    .hygoal-del-table { padding: 0 8px; height: 24px; }
    .hygoal-col-actions-col { width: 92px; }
    .hygoal-table th,
    .hygoal-table td {
      border: 1px solid #d0d0d0;
      padding: 0;
      position: relative;
      background: #fff;
      vertical-align: top;
    }
    .hygoal-table th { background: #f0f4f7; }
    .hygoal-table input {
      width: 100%;
      border: none;
      background: transparent;
      padding: 7px 8px;
      font-size: 13px;
      line-height: 1.4;
      box-sizing: border-box;
      color: #1c2530;
    }
    .hygoal-table th input { font-weight: 600; }
    .hygoal-table input:focus {
      outline: 2px solid #2f7d6d;
      outline-offset: -2px;
      background: #fff;
    }
    .hygoal-table .hygoal-selected input { background: #eef7f4; }

    /* 列操作按钮（每个表头单元格下方） */
    .hygoal-col-actions {
      display: flex;
      gap: 2px;
      justify-content: center;
      padding: 3px 2px;
      border-top: 1px solid #e3e8ee;
    }
    /* 行操作单元格 / 表头角落占位 */
    .hygoal-row-actions { width: 92px; text-align: center; vertical-align: middle; }
    .hygoal-corner { width: 92px; background: #f0f4f7; }

    .hygoal-act,
    .hygoal-del {
      min-width: 24px;
      height: 20px;
      padding: 0 3px;
      border: 1px solid #ccd4dc;
      border-radius: 3px;
      background: #fff;
      color: #1c2530;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }
    .hygoal-act:hover { background: #eef7f4; border-color: #2f7d6d; color: #2f7d6d; }
    .hygoal-del { color: #c0392b; border-color: #e6b8b1; }
    .hygoal-del:hover { background: #e74c3c; border-color: #e74c3c; color: #fff; }

    /* 底部快捷操作 */
    .hygoal-table-actions { display: flex; gap: 8px; }
    .hygoal-add {
      border: 1px solid #2f7d6d;
      background: #fff;
      color: #2f7d6d;
      padding: 5px 12px;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
    }
    .hygoal-add:hover { background: #eef7f4; }

    /* 预览面板里的只读表格 */
    .hygoal-table-preview { table-layout: auto; }
    .hygoal-table-preview th,
    .hygoal-table-preview td {
      padding: 4px 8px;
      text-align: left;
      font-size: 12px;
    }
  </style>
  <script>
    // 阻止 Decap CMS 自动初始化，改为手动控制顺序：
    // 先注册自定义 widget，再 init，确保「table」组件在渲染前就绪
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="./table-widget.js"></script>
  <script>
    // 自定义 widget 已注册完毕，现在初始化 CMS
    window.initCMS();
  </script>
</body>
</html>
